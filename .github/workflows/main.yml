name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Find the project (newest zip, or plain files)
        id: find
        shell: bash
        run: |
          Z=""
          while IFS= read -r f; do
            if unzip -Z1 "$f" 2>/dev/null | grep -F "settings.gradle.kts" > /dev/null; then Z="$f"; break; fi
          done < <(ls -1 ./*.zip 2>/dev/null | sort -rV)
          if [ -n "$Z" ]; then
            echo "Using zip: $Z"
            rm -rf unzipped_project
            unzip -oq "$Z" -d unzipped_project
            S=$(find unzipped_project -name settings.gradle.kts | head -n 1 || true)
          else
            echo "No project zip found - looking for plain project files"
            S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1 || true)
          fi
          if [ -z "$S" ]; then
            echo "Files in the repo:"; ls -la
            echo "::error title=Project files are missing::settings.gradle.kts was not found. Upload the project zip to the main page of this repo, then run again."
            exit 1
          fi
          echo "Project folder: $(dirname "$S")"
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - name: Check Supabase secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error title=Supabase secrets missing::Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions > New repository secret, then re-run."
            exit 1
          fi
          case "$SUPABASE_URL" in https://*) ;; *) echo "::error title=SUPABASE_URL must start with https://::Check the secret value."; exit 1;; esac

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Gradle 8.7 and Android SDK 34
        shell: bash
        run: |
          wget -q -O "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build the APK
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CUSTOMER_EMAIL_DOMAIN: ${{ secrets.CUSTOMER_EMAIL_DOMAIN }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show the real errors
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |^error: |error: |Unresolved reference|What went wrong|Execution failed|Could not |FAILURE" build.log | sed -E 's#file:///[^ ]*/(app/src/[^ ]*)#\1#' | head -n 40 > errors.txt || true
          F=$(printf '\140\140\140')
          { echo "### Build failed - send this to Claude"; echo "$F"; cat errors.txt; echo "$F"; } >> "$GITHUB_STEP_SUMMARY"
          head -n 10 errors.txt | while IFS= read -r line; do echo "::error::${line:0:300}"; done
          echo "----- last 60 log lines -----"; tail -n 60 build.log

      - name: Keep a copy on the run page
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealSupermarket-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK on the Releases page
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" RealSupermarket.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk RealSupermarket.apk --title "Real Supermarket APK" --notes "Built automatically. Download RealSupermarket.apk and install it." --target "${{ github.sha }}"

      - name: Where to download
        if: success()
        shell: bash
        run: |
          echo "### APK is ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Open: https://github.com/${{ github.repository }}/releases/tag/latest-apk" >> "$GITHUB_STEP_SUMMARY"
          echo "Or scroll down on this page to Artifacts > RealSupermarket-apk." >> "$GITHUB_STEP_SUMMARY"
